services:
  - type: web
    name: nineos-backend
    runtime: node
    rootDir: nineos-backend
    # --include=dev WAJIB: NODE_ENV=production membuat npm melewati
    # devDependencies, padahal @nestjs/cli (binary `nest`) ada di sana.
    # Tanpa ini build mati dengan "sh: 1: nest: not found", exit 127.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_TOKEN
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

      # ── AI provider ──────────────────────────────────────────
      # Sementara pakai Gemini. Untuk pindah ke Claude nanti:
      # isi ANTHROPIC_API_KEY lalu ubah AI_PROVIDER=anthropic.
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Agentic AI (Wave 6) ──────────────────────────────────
      - key: AGENT_AUTONOMY
        value: guarded
      - key: AGENT_WATCHER
        value: "on"

      # ── Platform live: Matcha + NotaBe ───────────────────────
      - key: MATCHA_API_URL
        sync: false
      - key: MATCHA_NINEOS_KEY
        sync: false
      - key: NOTABE_API_URL
        sync: false
      - key: NOTABE_NINEOS_KEY
        sync: false

      # ── Platform yang belum deploy (isi saat sudah live) ──────
      # Dibiarkan kosong dengan sengaja: PlatformKpiService akan
      # melewatinya, dan watcher tidak akan membuat alert selama
      # readinessStatus platform-nya bukan 'ready'.
      - key: KRAMA_API_URL
        sync: false
      - key: KRAMA_NINEOS_KEY
        sync: false
      - key: NINECLIP_API_URL
        sync: false
      - key: NINECLIP_NINEOS_KEY
        sync: false
